<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Tarot">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>The Tarot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manufacturing+Consent&display=swap" rel="stylesheet">
<style>
:root{ color-scheme: dark; --bg:#000; --line:#fff; --line-dim:#5a5a5a; --fg:#fff; --fg-dim:#8f8f8f; }
html{background:#000 !important;color-scheme:dark;height:100%;overscroll-behavior-y:contain;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  background:#000 !important;color:#fff;color-scheme:dark;
  font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Consolas,monospace;
  min-height:100vh;min-height:100dvh;line-height:1.5;font-size:13px;
  overscroll-behavior-y:contain;
  padding:calc(16px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(108px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
}
.shell{max-width:640px;margin:0 auto;}
svg.gl{display:inline-block;vertical-align:-0.16em;}

/* ---------- masthead ---------- */
header{text-align:center;margin-bottom:22px;}
.pentaWrap{width:42px;height:42px;margin:0 auto 14px;cursor:pointer;}
.pentaIcon{width:100%;height:100%;display:block;transform-origin:center center;user-select:none;}
@media (hover:none){
  .pentaIcon{animation:pentaSpin 16s linear infinite;}
}
@keyframes pentaSpin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
@media (prefers-reduced-motion:reduce){ .pentaIcon{animation:none;} }
h1{font-family:'Manufacturing Consent','IBM Plex Mono',serif;font-weight:400;
   font-size:clamp(38px,13vw,58px);line-height:1;letter-spacing:.01em;}
.kicker{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg-dim);margin-top:9px;line-height:1.7;}

/* ---------- shared controls ---------- */
.ac-wrap{position:relative;}
.ac-input{width:100%;background:rgba(0,0,0,.82);color:var(--fg);border:1px solid var(--line-dim);padding:16px 20px;font-family:inherit;font-size:17px;caret-color:#fff;text-align:center;border-radius:999px;}
.fakeCaret{position:absolute;left:50%;top:50%;width:2px;height:17px;background:#fff;
  transform:translate(-50%,-50%);pointer-events:none;animation:caretBlink 1s step-end infinite;}
.ac-input:not(:placeholder-shown) ~ .fakeCaret{display:none;}
.ac-wrap:focus-within .fakeCaret{display:none;}
@keyframes caretBlink{ 0%,50%{opacity:1;} 50.01%,100%{opacity:0;} }
@media (prefers-reduced-motion:reduce){ .fakeCaret{animation:none;} }
.ac-input::placeholder{color:#555;}
.ac-input:focus{outline:none;border-color:var(--fg);}
.ac-input.invalid{border-style:dashed;}
.ac-list{position:absolute;left:0;right:0;top:calc(100% + 2px);z-index:20;background:#000;border:1px solid var(--fg);max-height:250px;overflow-y:auto;display:none;}
.ac-list.open{display:block;}
.ac-item{padding:10px 11px;cursor:pointer;font-size:12.5px;border-bottom:1px solid #1a1a1a;}
.ac-item:last-child{border-bottom:none;}
.ac-item .grp{color:var(--fg-dim);font-size:10px;margin-right:7px;}
.ac-item.hi,.ac-item:hover{background:#161616;}

button.act{width:100%;padding:13px 8px;cursor:pointer;font-family:inherit;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;user-select:none;touch-action:manipulation;position:relative;overflow:hidden;border-radius:6px;}
.primary{background:var(--fg);color:#000;border:1px solid var(--fg);font-weight:600;}
.primary:hover{background:#ddd;}
.primary:active{transform:scale(.985);}
.ghost{background:#000;color:var(--fg);border:1px solid var(--line-dim);}
.ghost:hover{border-color:var(--fg);}
button:focus-visible{outline:1px solid var(--fg);outline-offset:2px;}
/* sweep on press */
.primary.pressed::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(0,0,0,.35),transparent);animation:sweep .5s ease-out;}
@keyframes sweep{from{transform:translateX(-100%);}to{transform:translateX(100%);}}

.subtle{display:block;width:100%;background:none;border:none;color:var(--fg-dim);font-family:inherit;
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;padding:12px 4px 2px;cursor:pointer;text-align:center;}
.subtle:hover{color:var(--fg);}
.solo-actions{display:flex;gap:12px;justify-content:center;margin-top:22px;}
.solo-actions button.act{width:auto;flex:0 0 auto;padding-left:28px;padding-right:28px;}
.solo-actions .subtle{width:auto;flex:1;}

/* ---------- interpret tab ---------- */
.slot{margin-bottom:13px;position:relative;}
.slot-head{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;}
.slot-num{color:var(--fg-dim);font-size:11px;}
.slot-name{font-weight:600;font-size:12.5px;letter-spacing:.02em;}
.slot-q{font-size:11px;color:var(--fg-dim);margin:0 0 5px 22px;}
.group-label{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--fg-dim);margin:18px 0 8px;}

/* ---------- spread picker ---------- */
.spread-select{position:relative;margin-bottom:18px;}
.spread-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;background:#000;border:1px solid var(--fg);color:var(--fg);padding:12px 14px;cursor:pointer;font-family:inherit;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;user-select:none;touch-action:manipulation;}
.spread-toggle .cur{font-weight:600;}
.spread-toggle .caret{color:var(--fg-dim);transition:transform .15s;}
.spread-toggle[aria-expanded="true"] .caret{transform:rotate(180deg);}
.spread-menu{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:#000;border:1px solid var(--fg);display:none;max-height:320px;overflow-y:auto;}
.spread-menu.open{display:block;}
.spread-opt{padding:12px 14px;cursor:pointer;font-size:12px;letter-spacing:.04em;border-bottom:1px solid #1a1a1a;user-select:none;touch-action:manipulation;}
.spread-opt:last-child{border-bottom:none;}
.spread-opt:hover,.spread-opt.hi{background:#141414;}
.spread-opt[aria-selected="true"]{font-weight:600;}
.spread-opt[aria-selected="true"]::before{content:'\203A  ';}

/* ---------- custom spread builder ---------- */
.cust-row{border:1px solid var(--line-dim);padding:11px 12px;margin-bottom:9px;}
.cust-top{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.cust-n{font-size:10px;letter-spacing:.14em;color:var(--fg-dim);flex:0 0 auto;}
.cust-label{flex:1;background:#000;border:none;border-bottom:1px solid var(--line-dim);color:var(--fg);
  font-family:inherit;font-size:12px;padding:4px 2px;}
.cust-label:focus{outline:none;border-bottom-color:var(--fg);}
.cust-del{background:none;border:none;color:var(--fg-dim);font-size:15px;cursor:pointer;padding:2px 5px;flex:0 0 auto;}
.cust-del:hover{color:var(--fg);}
.builder-actions{display:flex;gap:8px;margin:14px 0 4px;}
.builder-actions button{flex:1;}

/* ---------- results (unchanged formatting) ---------- */
#out{margin-top:24px;min-height:40px;}
.empty{text-align:center;color:var(--fg-dim);padding:34px 16px;border:1px dashed var(--line-dim);font-size:12px;}
.sect{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);}
.card-block{border:1px solid var(--line-dim);padding:13px 14px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start;}
.card-block.has-image{flex-wrap:wrap;}
.cb-img{flex:0 0 auto;max-width:140px;border:1px solid var(--line-dim);}
.cb-img img{display:block;width:100%;height:auto;}
.cb-info{flex:1;min-width:200px;}
.cb-pos{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-dim);margin-bottom:5px;}
.cb-name{font-size:16px;font-weight:600;line-height:1.25;margin-bottom:2px;}
.cb-title{font-size:11.5px;color:var(--fg-dim);margin-bottom:9px;}
@media (max-width: 480px){
  .card-block{flex-direction:column;}
  .cb-img{max-width:100%;align-self:center;}
  .cb-info{width:100%;}
}
.attrs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
.attr{font-size:10px;letter-spacing:.02em;border:1px solid var(--line-dim);padding:3px 7px;color:var(--fg-dim);}
.attr b{color:var(--fg);font-weight:600;}
.attr.star{border-color:var(--fg);color:var(--fg);}
.mean{font-size:12.5px;line-height:1.55;}
.mean .lead{color:var(--fg);}
.mean .rest{color:var(--fg-dim);}
.chain{display:flex;align-items:stretch;border:1px solid var(--line-dim);margin:7px 0 10px;}
.chain-end{flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:10px 12px;min-width:66px;border-right:1px solid var(--line-dim);}
.chain-end:last-child{border-right:none;border-left:1px solid var(--line-dim);}
.chain-glyph{line-height:0;margin-bottom:5px;}
.chain-glyph svg.gl{width:19px;height:19px;vertical-align:middle;}
.chain-el{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-dim);text-align:center;}
.chain-mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:10px 8px;text-align:center;}
.chain-verb{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;}
.chain-arrow{font-size:13px;margin-bottom:2px;}
.chain-why{font-size:10.5px;color:var(--fg-dim);margin-top:3px;line-height:1.35;}
.res{border:1px solid var(--fg);padding:11px 13px;margin-bottom:10px;}
.res-head{font-size:10px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:7px;}
.res-item{font-size:12px;line-height:1.5;margin-bottom:5px;}
.res-item:last-child{margin-bottom:0;}
.res-item b{font-weight:600;}
.res-item .via{color:var(--fg-dim);font-style:italic;}
.note{font-size:11.5px;color:var(--fg-dim);padding:10px 12px;border-left:2px solid var(--line-dim);margin-bottom:10px;line-height:1.55;}
.reading{border-left:2px solid var(--fg);padding:4px 16px 4px 15px;margin-bottom:10px;}
.reading p{font-size:13.5px;line-height:1.75;color:var(--fg);}

/* ---------- solo card: combined black info block ---------- */
.soloInfo{background:rgba(0,0,0,.82);border:1px solid var(--line-dim);border-radius:12px;padding:22px 16px;margin-top:20px;width:min(80vw,360px);margin-left:auto;margin-right:auto;}
.soloInfo-title{font-family:'Manufacturing Consent','IBM Plex Mono',serif;font-weight:400;
  font-size:clamp(38px,13vw,58px);text-align:center;line-height:1.05;margin-bottom:8px;
  white-space:nowrap;overflow:hidden;}
.soloInfo-subtitle{text-align:center;font-size:11px;color:var(--fg-dim);letter-spacing:.1em;
  text-transform:uppercase;margin-bottom:18px;}
.soloInfo-attrs{justify-content:center;margin-bottom:18px;}
.soloInfo-attrs .attr{border-radius:7px;}
.soloInfo-numTheme{text-align:center;margin-bottom:14px;}
.soloInfo-meaning{font-size:14.5px;font-weight:600;line-height:1.6;margin-bottom:20px;}
.soloInfo-reading{margin-bottom:0;}
.reading p + p{margin-top:12px;}

/* ---------- tabbar (prominent bordered buttons) ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#000;
  display:flex;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));}
.tab{flex:1;background:#000;border:1px solid var(--fg);color:var(--fg);font-family:inherit;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:13px 4px;cursor:pointer;font-weight:600;
  user-select:none;touch-action:manipulation;border-radius:2px;}
.tab[aria-selected="true"]{background:var(--fg);color:#000;}
.pane{display:none;} .pane.on{display:block;}
#pane-read{position:relative;}
.panoBg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;
  opacity:0;transition:opacity 1.1s ease;pointer-events:none;filter:brightness(1.125);}
.panoBg.on{opacity:.55;}
.panoBg::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.35);}
#pane-read > *:not(.panoBg), #pane-quiz > *:not(.panoBg){position:relative;z-index:1;}
@media (prefers-reduced-motion:reduce){ .panoBg{transition:none;} }

/* ---------- card slot (shared: solo + quiz + spread positions) ---------- */
.cardSlot{position:relative;width:150px;height:250px;perspective:1200px;cursor:pointer;flex:0 0 auto;}
.cardSlot.big{width:min(80vw,360px);height:auto;aspect-ratio:3/5;}
.mainCol{width:min(80vw,360px);margin-left:auto;margin-right:auto;}
.cardFace{position:absolute;inset:0;border-radius:8px;border:1px solid var(--line-dim);overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .55s cubic-bezier(.3,.85,.3,1);
  background:#000;display:flex;align-items:center;justify-content:center;}
.cardFace img{width:100%;height:100%;object-fit:contain;display:block;background:#000;}
.cardFace.back{transform:rotateY(0deg);z-index:2;}
.cardFace.front{transform:rotateY(180deg);}
.cardSlot.flipped .cardFace.back{transform:rotateY(180deg);}
.cardSlot.flipped .cardFace.front{transform:rotateY(360deg);z-index:2;}
.cardSlot[data-i]{cursor:pointer;}
.slotLabel{margin-top:8px;text-align:center;font-size:9px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--fg-dim);line-height:1.3;}
@media (prefers-reduced-motion:reduce){ .cardFace{transition:none;} }

/* ---------- floating card: scale-zoom breathing with table shadow ---------- */
/* .cardMount is shared by every hovering card (solo + quiz) so this animation can never
   be forgotten on one of them — it was previously ID-scoped, which was the root cause of
   the Quiz Me card floating in the wrong place (no transform meant no centering at all). */
.cardStage{display:flex;justify-content:center;padding:38px 0 32px;}
.cardMount{border-radius:8px;transform-origin:center center;
  animation:cardBreathe 4.6s ease-in-out infinite;}
@keyframes cardBreathe{
  0%,100%{ transform:scale(1); box-shadow:0 3px 6px 0 rgba(0,0,0,.6); }
  50%{ transform:scale(1.08); box-shadow:0 24px 34px 2px rgba(0,0,0,.22); }
}
@media (prefers-reduced-motion:reduce){
  .cardMount{animation:none; box-shadow:0 3px 6px 0 rgba(0,0,0,.6); transform:scale(1);}
}

/* ---------- quiz ---------- */
.quiz-count{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--fg-dim);text-align:center;margin-bottom:10px;}
#quizMeaning{margin-top:6px;}

/* ---------- picker (full 78 cards) ---------- */
.pickerOverlay{position:fixed;inset:0;z-index:90;background:#000;display:none;flex-direction:column;
  padding-top:env(safe-area-inset-top);}
.pickerOverlay.open{display:flex;}
.pickerHead{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;
  border-bottom:1px solid var(--line-dim);font-size:11px;letter-spacing:.16em;text-transform:uppercase;}
.pickerHead button{background:none;border:none;color:var(--fg);font-size:22px;cursor:pointer;line-height:1;padding:2px 6px;}
.pickerGrid{flex:1;overflow-y:auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px;}
.pickerGrid .grpHead{grid-column:1/-1;font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--fg-dim);margin:14px 0 2px;border-bottom:1px solid #1a1a1a;padding-bottom:5px;}
.pickerGrid .grpHead:first-child{margin-top:0;}
.pickCard{cursor:pointer;text-align:center;user-select:none;touch-action:manipulation;}
.pickCard img{width:100%;aspect-ratio:3/5;object-fit:contain;background:#000;border:1px solid var(--line-dim);border-radius:5px;
  display:block;margin-bottom:4px;}
.pickCard:active img{border-color:var(--fg);}
.pickCard .pn{font-size:8.5px;color:var(--fg-dim);line-height:1.25;}

/* ---------- spread mat ---------- */
.mat{position:relative;border:1px solid var(--line-dim);border-radius:10px;padding:24px 12px 14px;margin-bottom:16px;
  min-height:120px;}
.mat .cardSlot{width:72px;height:120px;margin:0 auto;}
.matCell{position:relative;width:70px;}
.matRow{display:flex;justify-content:center;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
.matRow:last-child{margin-bottom:0;}
.matCross{display:grid;grid-template-columns:72px 72px 72px;grid-template-rows:auto auto auto;
  grid-template-areas:". top ." "left mid right" ". bottom .";
  justify-content:center;column-gap:10px;row-gap:8px;margin-bottom:6px;}
.matStack{position:relative;width:72px;height:120px;margin:0 auto;}
.matStack .cardSlot{position:absolute;top:0;left:0;}
.matStack .cardSlot.stackRot{transform:rotate(90deg);}


/* ---------- install hint ---------- */
.install-hint{display:flex;align-items:center;gap:10px;border:1px solid var(--line-dim);padding:10px 12px;margin-bottom:16px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-dim);}
.install-hint span.txt{flex:1;line-height:1.5;text-align:left;}
.install-hint b{color:var(--fg);}
.install-hint button{background:none;border:1px solid var(--line-dim);color:var(--fg);padding:6px 9px;font-family:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;flex:0 0 auto;}
.install-hint button:hover{border-color:var(--fg);}
.install-hint .x{border:none;padding:6px 4px;color:var(--fg-dim);font-size:13px;}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="pentaWrap" id="pentaWrap" role="button" tabindex="0" aria-label="Reset to default">
      <img src="./pentagram.png" class="pentaIcon" id="pentaIcon" alt="">
    </div>
    <h1>The Tarot</h1>
    <div class="kicker">Determine your destiny!<br>Predict your own future!</div>
  </header>

  <div id="installHint"></div>

  <!-- INTERPRET (1 CARD) -->
  <div class="pane on" id="pane-read">
    <div class="panoBg" id="panoBg"></div>
    <div class="cardStage">
      <div class="cardSlot big cardMount" id="soloSlot" data-empty="1">
        <div class="cardFace back" id="soloBack">
          <img src="./cards/card_back.png" alt="Card back" loading="lazy">
        </div>
        <div class="cardFace front" id="soloFront"></div>
      </div>
    </div>
    <div class="ac-wrap mainCol" style="margin-top:16px;">
      <input type="text" id="soloInput" class="ac-input" autocomplete="off" spellcheck="false" autofocus
             placeholder="Spell Your Fate" data-cardid="" enterkeyhint="go">
      <span class="fakeCaret" aria-hidden="true"></span>
      <div class="ac-list" id="soloList"></div>
    </div>
    <div class="solo-actions mainCol">
      <button class="act primary" id="soloRandom">Random</button>
      <button class="act primary" id="soloReset">Reset</button>
    </div>
    <div id="soloOut"></div>
  </div>

  <!-- QUIZ ME -->
  <div class="pane" id="pane-quiz">
    <div class="panoBg" id="quizPanoBg"></div>
    <div class="quiz-count" id="quizCount"></div>
    <div class="cardStage">
      <div class="cardSlot big cardMount" id="quizSlot" data-empty="1">
        <div class="cardFace back" id="quizBack">
          <img src="./cards/card_back.png" alt="Card back" loading="lazy">
        </div>
        <div class="cardFace front" id="quizFront"></div>
      </div>
    </div>
    <div class="mainCol" style="margin-top:16px;">
      <button class="act primary" id="quizStart">Start</button>
      <button class="act primary" id="quizReveal" hidden>Reveal Meaning</button>
    </div>
    <div id="quizMeaning"></div>
    <div class="mainCol">
      <button class="act ghost" id="quizDrawAgain" hidden style="margin-bottom:8px;">Draw Again</button>
      <button class="act ghost" id="quizReshuffle">Reshuffle deck</button>
    </div>
  </div>

  <!-- SPREADS -->
  <div class="pane" id="pane-spreads">
    <div class="spread-select">
      <button class="spread-toggle" id="spreadToggle" aria-expanded="false" aria-haspopup="listbox">
        <span>Spread: <span class="cur" id="spreadCurrent">Past &middot; Present &middot; Future</span></span>
        <span class="caret">&#9662;</span>
      </button>
      <div class="spread-menu" id="spreadMenu" role="listbox"></div>
    </div>
    <div class="mat" id="mat"></div>
    <div id="slots"></div>
    <div id="builder"></div>
    <button class="subtle" id="spreadRandom">Draw at random</button>
    <div id="spreadOut"></div>
  </div>
</div>

<!-- full 78-card picker -->
<div class="pickerOverlay" id="pickerOverlay">
  <div class="pickerHead">
    <span>Choose a card</span>
    <button id="pickerClose" aria-label="Close">&times;</button>
  </div>
  <div class="pickerGrid" id="pickerGrid"></div>
</div>

<nav class="tabbar" role="tablist">
  <button class="tab" id="tab-read" role="tab" aria-selected="true" data-pane="read">1 Card</button>
  <button class="tab" id="tab-quiz" role="tab" aria-selected="false" data-pane="quiz">Quiz Me</button>
  <button class="tab" id="tab-spreads" role="tab" aria-selected="false" data-pane="spreads">Spreads</button>
</nav>

<script>

function glyph(name, px){
  const p = GLYPH_PATHS[name];
  if(!p) return '';
  const s = px || 13;
  return '<svg class="gl" viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" '+
         'stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
}
function mapGlyphs(names){
  const o = {};
  names.forEach(n => { o[n] = glyph(n); });
  return o;
}

/* ---------- card image paths ---------- */
function cardImagePath(card){
  if(card.kind === 'major'){
    // Convert Roman numeral to Arabic for the filename
    const romanMap={'0':0,'I':1,'II':2,'III':3,'IV':4,'V':5,'VI':6,'VII':7,'VIII':8,'IX':9,'X':10,
      'XI':11,'XII':12,'XIII':13,'XIV':14,'XV':15,'XVI':16,'XVII':17,'XVIII':18,'XIX':19,'XX':20,'XXI':21};
    const num = romanMap[card.numeral];
    if(num === undefined) return null;
    const padded = String(num).padStart(2,'0');
    const safeName = card.name.replace(/\s+/g,'_');
    return `./cards/${padded}_${safeName}.png`;
  } else if(card.kind === 'pip' || card.kind === 'court'){
    // Minor Arcana: "Ace of Cups" -> "Ace_of_Cups.png"
    const safeName = card.name.replace(/\s+/g,'_');
    return `./cards/${safeName}.png`;
  }
  return null;
}
function cardPanoPath(card){

    const num = romanMap[card.numeral];

}

const OPPOSED = [['Fire','Water'],['Air','Earth']];
const ALLIED  = [['Fire','Air'],['Water','Earth']];
function pairIn(list,a,b){return list.some(p=>(p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a));}
function dignity(a,b){
  if(a===b) return {verb:'AMPLIFY',arrow:'▲▲',why:'Same element — the theme intensifies itself.'};
  if(pairIn(ALLIED,a,b)) return {verb:'STRENGTHEN',arrow:'▲',why:(a==='Fire'||b==='Fire')?'Air feeds Fire — they reinforce each other.':'Water nourishes Earth — they reinforce each other.'};
  if(pairIn(OPPOSED,a,b)) return {verb:'WEAKEN',arrow:'▼',why:(a==='Fire'||b==='Fire')?'True opposites — Water extinguishes Fire.':'True opposites — Earth smothers Air.'};
  return {verb:'NEUTRAL',arrow:'—',why:'Adjacent, not opposed — neither feeds nor fights the other.'};
}

function planetsOf(c){
  const out=[];
  if(c.kind==='major'){
    if(c.planet) out.push({p:c.planet,src:'its planetary attribution',primary:true});
    else if(c.ruler) out.push({p:c.ruler,src:`ruler of ${c.zodiac}`,primary:false});
  } else if(c.kind==='pip'){
    if(c.sephPlanet) out.push({p:c.sephPlanet,src:`${c.seph}`,primary:true});
    if(c.decanPlanet) out.push({p:c.decanPlanet,src:`decan`,primary:true});
  }
  return out;
}
function resonance(a,b){
  const found=[];
  planetsOf(a).forEach(x=>planetsOf(b).forEach(y=>{
    if(x.p===y.p) found.push({planet:x.p, txt:`<b>${x.p} ${PGLYPH[x.p]}</b> in both — ${a.name} <span class="via">(${x.src})</span> and ${b.name} <span class="via">(${y.src})</span>.`, plain:`${x.p} runs underneath both — ${a.name} through ${x.src}, ${b.name} through ${y.src}.`, primary:x.primary&&y.primary});
  }));
  return found;
}
function attrs(c){
  const a=[];
  a.push(`<span class="attr">${EL[c.element]} <b>${c.element}</b></span>`);
  if(c.kind==='major'){
    if(c.pure) a.push(`<span class="attr">Pure element <b>—</b> no planet</span>`);
    if(c.planet) a.push(`<span class="attr">${PGLYPH[c.planet]} <b>${c.planet}</b></span>`);
    if(c.zodiac) a.push(`<span class="attr">${ZGLYPH[c.zodiac]} <b>${c.zodiac}</b></span>`);
    if(c.zodiac) a.push(`<span class="attr">ruled by <b>${c.ruler}</b> ${PGLYPH[c.ruler]}</span>`);
  }
  if(c.kind==='pip'){
    a.push(`<span class="attr">${c.num} · <b>${c.seph}</b>${c.sephPlanet?' '+PGLYPH[c.sephPlanet]+' '+c.sephPlanet:''}</span>`);
    if(c.decanPlanet) a.push(`<span class="attr">${PGLYPH[c.decanPlanet]} <b>${c.decanPlanet}</b> in ${c.decanSign} ${ZGLYPH[c.decanSign]}</span>`);
    else a.push(`<span class="attr">Root of the element <b>—</b> no decan</span>`);
    if(c.star) a.push(`<span class="attr star">★ decan matches Sephira</span>`);
  }
  if(c.kind==='court'){
    a.push(`<span class="attr"><b>${c.compound}</b></span>`);
    a.push(`<span class="attr">No decan <b>—</b> Four Worlds</span>`);
  }
  return `<div class="attrs">${a.join('')}</div>`;
}
function meanHTML(c){
  const parts=c.mean.split('•').map(x=>x.trim());
  return `<div class="mean"><span class="lead">${parts[0]}</span>`+(parts.length>1?`<span class="rest"> · ${parts.slice(1).join(' · ')}</span>`:'')+`</div>`;
}
function cardBlock(c,posName,i,opts){
  opts = opts||{};
  const imgPath = opts.skipImg ? null : cardImagePath(c);
  const hasImg = !!imgPath;
  return `<div class="card-block${hasImg ? ' has-image' : ''}">
    ${imgPath?`<div class="cb-img"><img src="${imgPath}" alt="${c.name}" loading="lazy"></div>`:''}
    <div class="cb-info">
      ${posName?`<div class="cb-pos">${i!=null?i+1+' · ':''}${posName}</div>`:''}
      <div class="cb-name">${c.kind==='major'?c.numeral+' '+c.name:c.name}</div>
      ${c.title?`<div class="cb-title">${c.title}</div>`:''}
      ${attrs(c)}
      ${c.kind==='pip'?`<div class="mean" style="margin-bottom:8px"><span class="rest">Number ${c.num}: ${c.numTheme}</span></div>`:''}
      ${meanHTML(c)}
    </div>
  </div>`;
}
function chainBlock(a,b,labelA,labelB){

    <div class="chain-end"><div class="chain-glyph">${EL[a.element]}</div><div class="chain-el">${labelA}</div></div>
    <div class="chain-mid"><div class="chain-arrow">${d.arrow}</div><div class="chain-verb">${d.verb}</div><div class="chain-why">${d.why}</div></div>
    <div class="chain-end"><div class="chain-glyph">${EL[b.element]}</div><div class="chain-el">${labelB}</div></div>
  </div>`;
}
function shortName(c){ if(c.kind==='major') return c.name.replace(/^The /,''); return c.name.replace(' of ',' · '); }
function displayName(c){ return c.kind==='major' ? c.numeral+' '+c.name : c.name; }
function resBlock(pairs){
  const items=[];
  pairs.forEach(([a,b])=>resonance(a,b).forEach(r=>items.push(r)));
  const uniq=[...new Map(items.map(r=>[r.txt,r])).values()];
  if(!uniq.length) return '';
  return `<div class="res"><div class="res-head">PLANETARY RESONANCE</div>`+uniq.map(r=>`<div class="res-item">${r.txt}${r.primary?'':' <span class="via">— via sign rulership, hold loosely.</span>'}</div>`).join('')+`</div>`;
}

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shortLead(c){ return c.mean.split('•')[0].trim(); }
function restKeywords(c){ return c.mean.split('•').slice(1).map(s=>s.trim()); }
function joinList(arr){ if(arr.length===0) return ''; if(arr.length===1) return arr[0]; return arr.slice(0,-1).join(', ')+', and '+arr[arr.length-1]; }
const CONNECTORS = {
  AMPLIFY: ["and doesn't let up — if anything it presses harder into the same note","doubling straight back on itself rather than moving past it","answering with more of exactly the same energy"],
  STRENGTHEN: ["which feeds it rather than fighting it","and the two lean into each other easily","reinforcing it rather than complicating it"],
  NEUTRAL: ["sitting alongside it rather than reacting to it","a genuine change of register — neither helped nor hindered","the two simply coexist, each doing its own separate work"],
  WEAKEN: ["which runs straight against it","true friction here, not just contrast","the two pull in real opposite directions"]
};
function cardFlavorSentence(c){
  if(c.kind==='major'){
    if(c.pure) return `It's one of only three cards in the whole deck answering to no planet or sign at all — pure, unmixed ${c.element.toLowerCase()}.`;
    if(c.planet) return `${c.planet} runs it — ${PLANET_MEAN[c.planet]} — which is exactly the register it plays in.`;
    return `${c.zodiac} carries it, and ${c.zodiac} answers to ${c.ruler} — ${PLANET_MEAN[c.ruler]}.`;
  }
  if(c.kind==='pip'){
    let s=`As a ${c.num}, it's working the ${c.numTheme} stage of the suit's own arc`;
    s += c.decanPlanet ? `, sharpened by its decan — ${c.decanPlanet} in ${c.decanSign} — into ${PLANET_MEAN[c.decanPlanet]}.` : `, sitting at the root of ${c.element.toLowerCase()} itself, before any single planet has shaped it.`;
    return s;
  }
  return `As the ${c.rank} of ${c.suit}, it's ${c.element.toLowerCase()} filtered through ${RANK_FLAVOR[c.rank]}.`;
}
function starSentence(c){
  return `And here's the kind of thing worth catching: ${displayName(c)} is one of the rare ★ cards, where the decan's planet and the Sephira's own planet turn out to be the very same body — ${c.decanPlanet}, arrived at twice, by two systems built centuries apart. That's not a small coincidence to wave off.`;
}
function narrateSingle(c){
  const lead=shortLead(c), rest=restKeywords(c);
  let p1=pick([`${displayName(c)} sits alone today, and it doesn't hedge: ${lead}.`,`Pulled on its own, ${displayName(c)} speaks plainly — ${lead}.`,`One card, one clear note. ${displayName(c)} is ${lead}.`]);
  let p2=cardFlavorSentence(c);
  let p3=rest.length?`There's a secondary thread worth keeping in view too — ${joinList(rest)}.`:'';
  let paras=[p1+' '+p2];
  if(p3) paras.push(p3);
  if(c.star) paras.push(starSentence(c));
  return paras.map(p=>`<p>${p}</p>`).join('');
}
function narrateChain(cards, positions){
  const sentences=[positions.length>1?`Read start to finish, this is a short arc — ${positions.length} beats, one throughline.`:''].filter(Boolean);
  for(let i=0;i<cards.length-1;i++){
    const a=cards[i], b=cards[i+1];
    const d=dignity(a.element,b.element);
    const conn=pick(CONNECTORS[d.verb]);
    const posA=positions.length>1?positions[i].n:null;
    const posB=positions.length>1?positions[i+1].n:null;
    sentences.push(`${posA?posA+' — ':''}${displayName(a)} is ${shortLead(a)}, ${conn}, ${posB?'moving into the '+posB.toLowerCase()+': ':''}${displayName(b)} — ${shortLead(b)}.`);
    const res=resonance(a,b);
    if(res.length) sentences.push(res.map(r=>r.plain).join(' '));
  }
  cards.forEach(c=>{ if(c.star) sentences.push(starSentence(c)); });
  sentences.push(`Start to finish: ${shortLead(cards[0])}, arriving — by way of everything between — at ${shortLead(cards[cards.length-1])}.`);
  return sentences.map(s=>`<p>${s}</p>`).join('');
}
function narrateBrief(cards){
  const els=cards.map(c=>c.element);
  const counts={}; els.forEach(e=>counts[e]=(counts[e]||0)+1);
  const dom=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  let s=`Across all ${cards.length} cards, this reads fundamentally as a ${dom[0]} story — ${ELEMENT_DOMAIN[dom[0]]}, more than anything else at work here.`;
  const starred=cards.filter(c=>c.star);
  if(starred.length) s+= ` ${starred.map(c=>displayName(c)).join(' and ')} stand out as the loudest cards in the spread — decan and Sephira agreeing outright, worth extra weight.`;
  s+= ` If you need the line to hold onto walking away: it starts as ${shortLead(cards[0])}, and — carried through everything above — ends up at ${shortLead(cards[cards.length-1])}.`;
  return `<p>${s}</p>`;
}
function buildSoloResultHTML(c){
  const nameLine = c.kind==='major' ? c.numeral+' '+c.name : c.name;
  let html = `<div class="soloInfo">`;
  html += `<div class="soloInfo-title">${nameLine}</div>`;
  if(c.title) html += `<div class="soloInfo-subtitle">${c.title}</div>`;
  html += attrs(c).replace('class="attrs"','class="attrs soloInfo-attrs"');
  if(c.kind==='pip') html += `<div class="mean soloInfo-numTheme"><span class="rest">Number ${c.num}: ${c.numTheme}</span></div>`;
  html += meanHTML(c).replace('class="mean"','class="mean soloInfo-meaning"');
  html += `<div class="reading soloInfo-reading">${narrateSingle(c)}</div>`;
  html += `</div>`;
  return html;
}
function narrativeSection(cards, spread){
  const s=spread||activeSpread();
  let body;
  if(cards.length===1) body=narrateSingle(cards[0]);
  else if(s.detailed) body=narrateChain(cards, s.positions);

  return `<div class="sect">THE READING</div><div class="reading">${body}</div>`;
}

function buildResultsHTML(cards, spread, opts){

    const sp=s.spine, spPairs=[];
    for(let i=0;i<sp.length-1;i++){
      html+=chainBlock(cards[sp[i]],cards[sp[i+1]],s.positions[sp[i]].n.replace('This Is ','').replace('This ',''),s.positions[sp[i+1]].n.replace('This Is ','').replace('This ',''));
      spPairs.push([cards[sp[i]],cards[sp[i+1]]]);
    }
    html+=resBlock(spPairs);

    html+=`<div class="sect">THE STAFF</div>`;
    html+=`<div class="note">Stance and Environment are parallel framings of the same moment, not a sequence. Only the Outcome is a true endpoint.</div>`;
    const stPairs=[];
    s.staffChain.forEach(([i,j])=>{ html+=chainBlock(cards[i],cards[j],shortName(cards[i]),shortName(cards[j])); stPairs.push([cards[i],cards[j]]); });
    html+=resBlock(stPairs);

    html+=`<div class="sect">FRAME CHECK</div>`;
    html+=chainBlock(cards[s.frame[0]],cards[s.frame[1]],'Covers','Outcome');
    html+=resBlock([[cards[s.frame[0]],cards[s.frame[1]]]]);
    html+=narrativeSection(cards, s);
  } else if(s.chain.length){
    html+=`<div class="sect">DIGNITIES</div>`;
    const pairs=[];
    s.chain.forEach(([i,j])=>{
      html+=chainBlock(cards[i],cards[j], s.positions.length>1?s.positions[i].n:shortName(cards[i]), s.positions.length>1?s.positions[j].n:shortName(cards[j]));
      pairs.push([cards[i],cards[j]]);
    });
    html+=resBlock(pairs);
    html+=narrativeSection(cards, s);
  } else {
    html+=narrativeSection(cards, s);
  }
  return html;
}

/* ---------- search: names + Arabic numerals ---------- */
const ARABIC_TO_MAJOR={};
DECK.filter(c=>c.kind==='major').forEach(c=>{
  const romanMap={'0':0,'I':1,'II':2,'III':3,'IV':4,'V':5,'VI':6,'VII':7,'VIII':8,'IX':9,'X':10,
    'XI':11,'XII':12,'XIII':13,'XIV':14,'XV':15,'XVI':16,'XVII':17,'XVIII':18,'XIX':19,'XX':20,'XXI':21};
  const v=romanMap[c.numeral];
  if(v!==undefined) ARABIC_TO_MAJOR[v]=c;
});
function suitTag(c){ return c.kind==='major' ? 'MAJ' : c.suit.slice(0,4).toUpperCase(); }
function matches(query){
  const raw=query.trim().toLowerCase();
  if(!raw) return [];
  const asNum=/^\d{1,2}$/.test(raw)?parseInt(raw,10):null;
  const numWord=(asNum!==null && RANKNAME[asNum])?RANKNAME[asNum].toLowerCase():null;
  const starts=[], contains=[];
  if(asNum!==null && ARABIC_TO_MAJOR[asNum]) starts.push(ARABIC_TO_MAJOR[asNum]);
  DECK.forEach(c=>{
    if(starts.indexOf(c)!==-1) return;
    const n=c.name.toLowerCase();
    const numeral=c.kind==='major'?c.numeral.toLowerCase():'';
    const hitStart = n.startsWith(raw) || (numWord && n.startsWith(numWord)) || (numeral && numeral===raw);
    const hitContain = !hitStart && (n.includes(raw) || (numWord && n.includes(numWord)));
    if(hitStart) starts.push(c); else if(hitContain) contains.push(c);
  });
  return [...starts,...contains].slice(0,9);
}
function attachAutocomplete(input, list, onChoose){
  let hiIndex=-1, items=[];
  function render(q){
    items=matches(q); hiIndex=-1;
    if(!items.length){ list.classList.remove('open'); list.innerHTML=''; return; }
    list.innerHTML=items.map((c,i)=>`<div class="ac-item" data-i="${i}"><span class="grp">${suitTag(c)}</span>${c.kind==='major'?c.numeral+' ':''}${c.name}</div>`).join('');
    list.classList.add('open');
    [...list.children].forEach(el=>{ el.addEventListener('mousedown', e=>{ e.preventDefault(); choose(items[+el.dataset.i]); }); });
  }
  function choose(c){
    input.value=c.name; input.dataset.cardid=c.id; input.classList.remove('invalid');
    list.classList.remove('open'); list.innerHTML='';
    if(onChoose) onChoose(c);
  }
  input.addEventListener('input', ()=>{ input.dataset.cardid=''; input.classList.remove('invalid'); render(input.value); });
  input.addEventListener('keydown', e=>{
    if(!list.classList.contains('open')){
      if(e.key==='Enter'){
        e.preventDefault();
        const exact=BY_NAME_LOWER[input.value.trim().toLowerCase()];
        if(exact) choose(exact);
      }
      return;
    }
    if(e.key==='ArrowDown'){ e.preventDefault(); hiIndex=Math.min(hiIndex+1,items.length-1); highlight(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); hiIndex=Math.max(hiIndex-1,0); highlight(); }
    else if(e.key==='Enter'){ e.preventDefault(); if(items.length) choose(items[hiIndex>=0?hiIndex:0]); }
    else if(e.key==='Escape'){ list.classList.remove('open'); }
  });
  function highlight(){
    [...list.children].forEach((el,i)=>el.classList.toggle('hi', i===hiIndex));
    const el=list.children[hiIndex]; if(el) el.scrollIntoView({block:'nearest'});
  }
  input.addEventListener('blur', ()=>{
    setTimeout(()=>{
      list.classList.remove('open');
      if(!input.dataset.cardid){
        const exact=BY_NAME_LOWER[input.value.trim().toLowerCase()];
        if(exact){ input.dataset.cardid=exact.id; input.value=exact.name; choose(exact); }
        else if(input.value.trim()){ input.classList.add('invalid'); }
      }
    },120);
  });
}

  d.setAttribute('aria-selected', k===mode);
  d.onclick=()=>{
    mode=k; curEl.innerHTML=s.label;
    [...menuEl.children].forEach(o=>o.setAttribute('aria-selected', o.dataset.k===mode));
    closeMenu(); buildSpreadUI();
  };
  menuEl.appendChild(d);
});
function openMenu(){ menuEl.classList.add('open'); toggleBtn.setAttribute('aria-expanded','true'); }
function closeMenu(){ menuEl.classList.remove('open'); toggleBtn.setAttribute('aria-expanded','false'); }
toggleBtn.addEventListener('click', ()=>{ menuEl.classList.contains('open')?closeMenu():openMenu(); });
document.addEventListener('click', e=>{ if(!e.target.closest('.spread-select')) closeMenu(); });

/* positionCards[i] holds the chosen card object for slot i, or null */
let positionCards=[];

function buildSpreadUI(){
  const s=activeSpread();
  positionCards = s.positions.map(()=>null);
  builderEl.innerHTML='';
  spreadOutEl.innerHTML='';
  if(mode==='custom') buildCustom();
  buildMat(s);
  buildTextSlots(s);
}

/* mat: card-back slots laid out to mirror the table position of the spread */
function buildMat(s){
  matEl.innerHTML = s.celtic ? celticMatHTML(s) : rowsMatHTML(s);
  matEl.querySelectorAll('.cardSlot[data-i]').forEach(el=>{
    const i=+el.dataset.i;
    el.addEventListener('click', ()=>{
      if(positionCards[i]) return;
      openPicker(c=>assignPosition(i,c));
    });
  });
}
function rowsMatHTML(s){
  let html='';
  s.rows.forEach(row=>{
    html+='<div class="matRow">';
    row.forEach(i=>{
      html+=`<div class="matCell">${slotHTML(i)}<div class="slotLabel">${s.positions[i].n}</div></div>`;
    });
    html+='</div>';
  });
  return html;
}
function celticMatHTML(s){
  const cell=(i,area)=>`<div class="matCell" style="grid-area:${area};">${slotHTML(i)}<div class="slotLabel">${s.positions[i].n}</div></div>`;
  let html='<div class="matCross">';
  html+=cell(4,'top');
  html+=cell(3,'left');
  html+=`<div class="matCell" style="grid-area:mid;">
    <div class="matStack">
      <div class="cardSlot" data-i="0"><div class="cardFace back"><img src="./cards/card_back.png" alt="Card back" loading="lazy"></div><div class="cardFace front"></div></div>
      <div class="cardSlot stackRot" data-i="1"><div class="cardFace back"><img src="./cards/card_back.png" alt="Card back" loading="lazy"></div><div class="cardFace front"></div></div>
    </div>
    <div class="slotLabel">Covers &amp; Crosses</div>
  </div>`;
  html+=cell(5,'right');
  html+=cell(2,'bottom');
  html+='</div>';
  html+='<div class="matRow" style="margin-top:36px;">';
  [6,7,8,9].forEach(i=>{ html+=`<div class="matCell">${slotHTML(i)}<div class="slotLabel">${s.positions[i].n}</div></div>`; });
  html+='</div>';
  return html;
}

function buildTextSlots(s){
  let html='', lastGrp=null;
  s.positions.forEach((p,i)=>{
    if(p.grp && p.grp!==lastGrp){ html+=`<div class="group-label">${p.grp}</div>`; lastGrp=p.grp; }
    html+=`<div class="slot">
      <div class="slot-head"><span class="slot-num">${i+1}</span><span class="slot-name">${p.n}</span></div>
      ${p.q?`<div class="slot-q">${p.q}</div>`:''}
      <div class="ac-wrap">
        <input type="text" id="s${i}" class="ac-input" autocomplete="off" spellcheck="false" placeholder="Name a card\u2026" data-cardid="">
        <div class="ac-list" id="ac${i}"></div>
      </div>
    </div>`;
  });
  slotsEl.innerHTML=html;
  s.positions.forEach((p,i)=>{
    attachAutocomplete(document.getElementById('s'+i), document.getElementById('ac'+i), c=>assignPosition(i,c));
  });
}

function buildCustom(){
  let html='<div class="group-label">Your spread</div>';
  customPositions.forEach((p,i)=>{
    html+=`<div class="cust-row">
      <div class="cust-top">
        <span class="cust-n">${i+1}</span>
        <input class="cust-label" id="lab${i}" value="${(p.n||'').replace(/"/g,'&quot;')}" placeholder="Name this position\u2026">
        <button class="cust-del" data-del="${i}" aria-label="Remove position">&times;</button>
      </div>
    </div>`;
  });
  html+=`<div class="builder-actions"><button class="act ghost" id="addPos">Add a position</button></div>`;
  builderEl.innerHTML=html;
  customPositions.forEach((p,i)=>{
    document.getElementById('lab'+i).addEventListener('input', e=>{
      customPositions[i].n=e.target.value;
      buildMat(activeSpread());
      buildTextSlots(activeSpread());
      positionCards.forEach((c,idx)=>{ if(c) reflectAssignment(idx,c); });
    });
  });
  builderEl.querySelectorAll('[data-del]').forEach(b=>{
    b.onclick=()=>{
      if(customPositions.length<=1) return;
      customPositions.splice(+b.dataset.del,1);
      buildSpreadUI();
    };
  });
  document.getElementById('addPos').onclick=()=>{
    customPositions=[...customPositions,{n:'Position '+(customPositions.length+1)}];
    buildSpreadUI();
  };
}

function reflectAssignment(i,c){
  const matSlot=matEl.querySelector(`.cardSlot[data-i="${i}"]`);
  if(matSlot){
    flipFace(matSlot.querySelector('.cardFace.front'), cardImagePath(c), c.name);
    matSlot.classList.add('flipped');
  }
  const input=document.getElementById('s'+i);
  if(input){ input.value=c.name; input.dataset.cardid=c.id; input.classList.remove('invalid'); }
}
function assignPosition(i, c){
  positionCards[i]=c;
  reflectAssignment(i,c);
  maybeRenderSpread();
}

function maybeRenderSpread(){
  const s=activeSpread();
  if(positionCards.some(c=>!c)){ spreadOutEl.innerHTML=''; return; }
  spreadOutEl.innerHTML=buildResultsHTML(positionCards, s);
  spreadOutEl.scrollIntoView({behavior:'smooth',block:'nearest'});
}

document.getElementById('spreadRandom').onclick=()=>{
  const s=activeSpread();
  const cards=randomCards(s.positions.length);
  cards.forEach((c,i)=>assignPosition(i,c));
};

/* ---------- tabs ---------- */
function switchToTab(pane){
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected', x.dataset.pane===pane));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on', p.id==='pane-'+pane));
  if(pane==='quiz' && !quizCard) resetQuizToStart();
  window.scrollTo({top:0,behavior:'smooth'});
}
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>switchToTab(t.dataset.pane);
});

/* ---------- masthead pentagram: follows cursor on desktop, spins via CSS on touch ---------- */
const pentaIcon=document.getElementById('pentaIcon');
document.getElementById('pentaWrap')?.addEventListener('click', ()=>{ switchToTab('read'); resetSolo(); });
document.getElementById('pentaWrap')?.addEventListener('keydown', (e)=>{
  if(e.key==='Enter' || e.key===' '){ e.preventDefault(); switchToTab('read'); resetSolo(); }
});
if(window.matchMedia('(hover:hover)').matches){
  document.addEventListener('mousemove', e=>{
    const rect=pentaIcon.getBoundingClientRect();
    const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
    const angle=Math.atan2(e.clientY-cy, e.clientX-cx)*180/Math.PI;
    pentaIcon.style.transform=`rotate(${angle-90}deg)`;
  });
}

buildSpreadUI();
try{ soloInput.focus({preventScroll:true}); }catch(e){ soloInput.focus(); }

/* ---------- home-screen install hint ---------- */
(function(){
  var isStandalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  var box = document.getElementById('installHint');
  if (!box || isStandalone) return;
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  function render(text, actionLabel, onAction){
    box.innerHTML = '<div class="install-hint"><span class="txt">'+text+'</span></div>';
    var el = box.querySelector('.install-hint');
    if (actionLabel){
      var btn = document.createElement('button');
      btn.textContent = actionLabel; btn.onclick = onAction; el.appendChild(btn);
    }
    var x = document.createElement('button');
    x.className='x'; x.textContent='\u00d7'; x.setAttribute('aria-label','Dismiss');
    x.onclick=function(){ box.innerHTML=''; };
    el.appendChild(x);
  }
  var deferredPrompt=null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferredPrompt=e;
    render('<b>Install this app</b> for one-tap access from your home screen.', 'Add', function(){
      box.innerHTML=''; deferredPrompt.prompt();
      deferredPrompt.userChoice.finally(function(){ deferredPrompt=null; });
    });
  });
  if (isIOS) render('<b>Add to Home Screen:</b> tap Share, then "Add to Home Screen."', null, null);
})();

if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });
}
</script>
